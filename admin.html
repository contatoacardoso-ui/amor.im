<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - AMOR.IM CERÂMICAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-yellow: #FEFEF0;
            --primary-purple: #4A3A63;
            --accent-purple: #6B548E;
            --text-dark: #2D2438;
            --white: #FFFFFF;
            --danger: #d9534f;
            --success: #5cb85c;
            --warning: #f0ad4e;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-yellow); color: var(--text-dark); padding: 20px; max-width: 600px; margin: 0 auto; }

        h1, h2 { color: var(--primary-purple); margin-bottom: 16px; }
        .card { background: var(--white); padding: 20px; border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,0.05); margin-bottom: 20px; }

        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--primary-purple); }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 14px; font-size: 0.9rem; }
        textarea { resize: vertical; min-height: 80px; }
        
        button { background: var(--primary-purple); color: var(--white); border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        button:hover { background: var(--accent-purple); }
        .btn-danger { background: var(--danger); padding: 6px 12px; }
        .btn-warning { background: var(--warning); color: #fff; padding: 6px 12px; }
        .btn-success { background: var(--success); }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; gap: 10px; }
        .item-info { font-size: 0.85rem; }
        .flex { display: flex; gap: 10px; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .preview-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 8px; }
        .tab-btn { background: #eee; color: var(--text-dark); border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .tab-btn.active { background: var(--primary-purple); color: white; }

        .existing-extras-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .thumb-removable { position: relative; width: 60px; height: 60px; border-radius: 6px; overflow: hidden; border: 1px solid #ccc; }
        .thumb-removable img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-removable button {
            position: absolute; top: 2px; right: 2px; background: rgba(217, 83, 79, 0.9);
            color: white; border: none; border-radius: 50%; width: 20px; height: 20px;
            font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
        }

        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-yellow); display: flex; justify-content: center; align-items: center; z-index: 999; padding: 20px;
        }
        .login-box {
            background: var(--white); padding: 30px; border-radius: var(--radius);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center;
        }
    </style>
</head>
<body>

    <!-- Tela de Senha -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Área Restrita 🔒</h2>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 16px;">Insira a senha de administrador</p>
            <input type="password" id="passwordInput" placeholder="Senha" style="text-align: center;">
            <button onclick="checkPassword()" style="width: 100%;">Entrar</button>
        </div>
    </div>

    <!-- Conteúdo do Painel -->
    <div id="adminContent" style="display: none;">
        <div class="top-nav">
            <h1 id="panelTitle">Painel Admin 🎨</h1>
            <a href="index.html" target="_blank" style="color: var(--primary-purple); font-weight: 600; font-size: 0.9rem; text-decoration: none;"><i class="fa-solid fa-eye"></i> Ver Site</a>
        </div>
        
        <!-- Configuração da Logo -->
        <div class="card">
            <h2>Logo do Ateliê</h2>
            <div class="tab-buttons">
                <button type="button" class="tab-btn active" onclick="switchTab('logo', 'file')">Arquivo</button>
                <button type="button" class="tab-btn" onclick="switchTab('logo', 'url')">Link da Imagem</button>
            </div>
            <div id="logo-file-section">
                <label>Selecionar Ficheiro da Logo</label>
                <input type="file" id="logoFileInput" accept="image/*" onchange="previewLogoFile(this)">
            </div>
            <div id="logo-url-section" style="display:none;">
                <label>URL da Imagem da Logo</label>
                <input type="text" id="logoUrlInput" placeholder="https://exemplo.com/logo.jpg">
            </div>
            <button onclick="saveLogo()" style="margin-top: 10px; width: 100%;">Salvar Logo</button>
        </div>

        <!-- Gerenciar Categorias e Subgrupos -->
        <div class="card">
            <h2>Categorias e Subgrupos</h2>
            <label>Nova Categoria Principal</label>
            <div class="flex">
                <input type="text" id="newCategoryInput" placeholder="Ex: Utilitários">
                <button onclick="addCategory()">Adicionar</button>
            </div>
            <div id="categoriesList" style="margin-bottom: 14px;">A carregar...</div>

            <label>Novo Subgrupo (Vincular a uma Categoria)</label>
            <select id="subgroupParentSelect" style="margin-bottom: 8px;"></select>
            <div class="flex">
                <input type="text" id="newSubgroupInput" placeholder="Ex: Canecas">
                <button onclick="addSubgroup()">Criar Subgrupo</button>
            </div>
            <div id="subgroupsList">A carregar...</div>
        </div>

        <!-- Gerenciar Peças (Adicionar / Editar) -->
        <div class="card">
            <h2 id="formHeading">Adicionar Nova Peça</h2>
            <input type="hidden" id="editingProductId" value="">

            <label>Título da Peça</label>
            <input type="text" id="pTitle" placeholder="Ex: Galinhada">
            
            <label>Preço</label>
            <input type="text" id="pPrice" placeholder="Ex: 85,00" oninput="formatCurrency(this)">

            <label>Categoria Principal</label>
            <select id="pCategory" onchange="updateSubgroupDropdown()"></select>

            <label>Subgrupo (Opcional)</label>
            <select id="pSubgroup">
                <option value="">Nenhum</option>
            </select>
            
            <label>Informações Extras (Tamanho, Medida, Peso, Descrição...)</label>
            <textarea id="pDescription" placeholder="Ex: Altura: 10cm | Diâmetro: 8cm..."></textarea>
            
            <label>Foto Principal</label>
            <div class="tab-buttons">
                <button type="button" class="tab-btn active" onclick="switchTab('product', 'file')">Arquivo</button>
                <button type="button" class="tab-btn" onclick="switchTab('product', 'url')">Link da Imagem</button>
            </div>
            <div id="product-file-section">
                <input type="file" id="productFileInput" accept="image/*" onchange="previewProductFile(this)">
            </div>
            <div id="product-url-section" style="display:none;">
                <input type="text" id="pImage" placeholder="https://exemplo.com/foto.jpg">
            </div>

            <div id="existingExtrasSection" style="display:none;">
                <label>Fotos Extras Atuais (Clique no X para remover)</label>
                <div id="existingExtrasList" class="existing-extras-container"></div>
            </div>

            <label style="margin-top: 10px;">Adicionar Novas Fotos Extras (Opcional)</label>
            <input type="file" id="productExtraFilesInput" accept="image/*" multiple onchange="previewExtraFiles(this)">
            <div id="extraFilesPreview" style="font-size:0.75rem; color:#666; margin-bottom:10px;"></div>
            
            <div class="flex" style="margin-top: 10px;">
                <button onclick="saveProduct()" id="saveProductBtn" class="btn-success" style="flex: 2;">Cadastrar Peça</button>
                <button onclick="cancelEdit()" id="cancelEditBtn" class="btn-danger" style="flex: 1; display: none;">Cancelar</button>
            </div>
        </div>

        <!-- Lista de Peças Cadastradas -->
        <div class="card">
            <h2>Peças Cadastradas</h2>
            <div id="productsList">A carregar...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-9EgZW2PsJ3A1lwghkx8x5tjC6kd1dJg",
            authDomain: "amorimceramicas.firebaseapp.com",
            databaseURL: "https://amorimceramicas-default-rtdb.firebaseio.com",
            projectId: "amorimceramicas",
            storageBucket: "amorimceramicas.firebasestorage.app",
            messagingSenderId: "805924176382",
            appId: "1:805924176382:web:f9766ef6c7c43561f940af",
            measurementId: "G-8XQB9YEBRM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalData = {};
        let selectedLogoBase64 = "";
        let selectedProductBase64 = "";
        let selectedExtraBase64List = [];
        let currentEditingExtras = [];

        window.checkPassword = function() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === 'panqueca8589') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                initAdmin();
            } else {
                alert('Senha incorreta!');
            }
        }

        function initAdmin() {
            const dataRef = ref(db, 'amorim');
            onValue(dataRef, (snapshot) => {
                globalData = snapshot.val() || { categories: [], subgroups: [], products: {}, logo: "" };
                
                document.getElementById('logoUrlInput').value = globalData.logo || '';
                if (globalData.logo && globalData.logo.startsWith('data:')) {
                    selectedLogoBase64 = globalData.logo;
                }
                renderCategoriesAndSubgroups();
                renderProducts();
            });
        }

        window.formatCurrency = function(input) {
            let value = input.value.replace(/\D/g, "");
            if (!value) {
                input.value = "";
                return;
            }
            value = (Number(value) / 100).toFixed(2) + "";
            value = value.replace(".", ",");
            value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            input.value = "R$ " + value;
        }

        window.switchTab = function(type, mode) {
            const fileSec = document.getElementById(`${type}-file-section`);
            const urlSec = document.getElementById(`${type}-url-section`);
            const buttons = fileSec.parentElement.parentElement.querySelectorAll('.tab-btn');
            
            buttons.forEach(b => b.classList.remove('active'));
            if(mode === 'file') {
                fileSec.style.display = 'block';
                urlSec.style.display = 'none';
                event.target.classList.add('active');
            } else {
                fileSec.style.display = 'none';
                urlSec.style.display = 'block';
                event.target.classList.add('active');
            }
        }

        window.previewLogoFile = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { selectedLogoBase64 = e.target.result; }
                reader.readAsDataURL(input.files[0]);
            }
        }

        window.previewProductFile = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { selectedProductBase64 = e.target.result; }
                reader.readAsDataURL(input.files[0]);
            }
        }

        window.previewExtraFiles = function(input) {
            selectedExtraBase64List = [];
            if (input.files && input.files.length > 0) {
                let loadedCount = 0;
                Array.from(input.files).forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        selectedExtraBase64List.push(e.target.result);
                        loadedCount++;
                        document.getElementById('extraFilesPreview').innerText = `${loadedCount} nova(s) foto(s) extra(s) selecionada(s).`;
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        window.removeExistingExtra = function(index) {
            currentEditingExtras.splice(index, 1);
            renderExistingExtras();
        }

        function renderExistingExtras() {
            const container = document.getElementById('existingExtrasList');
            const section = document.getElementById('existingExtrasSection');
            if (!currentEditingExtras || currentEditingExtras.length === 0) {
                section.style.display = 'none';
                container.innerHTML = '';
                return;
            }
            section.style.display = 'block';
            let html = '';
            currentEditingExtras.forEach((imgSrc, idx) => {
                html += `
                    <div class="thumb-removable">
                        <img src="${imgSrc}">
                        <button type="button" onclick="removeExistingExtra(${idx})"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.saveLogo = function() {
            let logoToSave = selectedLogoBase64;
            const urlInput = document.getElementById('logoUrlInput').value.trim();
            if (document.getElementById('logo-url-section').style.display !== 'none' && urlInput) {
                logoToSave = urlInput;
            }
            set(ref(db, 'amorim/logo'), logoToSave).then(() => alert('Logo atualizada com sucesso!'));
        }

        window.addCategory = function() {
            const catName = document.getElementById('newCategoryInput').value.trim();
            if(!catName) return;
            let cats = globalData.categories || [];
            if(!cats.includes(catName)) {
                cats.push(catName);
                set(ref(db, 'amorim/categories'), cats).then(() => {
                    document.getElementById('newCategoryInput').value = '';
                    alert('Categoria adicionada!');
                });
            }
        }

        window.deleteCategory = function(index) {
            let cats = globalData.categories || [];
            cats.splice(index, 1);
            set(ref(db, 'amorim/categories'), cats);
        }

        window.addSubgroup = function() {
            const parent = document.getElementById('subgroupParentSelect').value;
            const subName = document.getElementById('newSubgroupInput').value.trim();
            if(!parent || !subName) {
                alert('Selecione a categoria principal e digite o nome do subgrupo.');
                return;
            }
            let subs = globalData.subgroups || [];
            subs.push({ parent, name: subName });
            set(ref(db, 'amorim/subgroups'), subs).then(() => {
                document.getElementById('newSubgroupInput').value = '';
                alert('Subgrupo criado com sucesso!');
            });
        }

        window.deleteSubgroup = function(index) {
            let subs = globalData.subgroups || [];
            subs.splice(index, 1);
            set(ref(db, 'amorim/subgroups'), subs);
        }

        window.updateSubgroupDropdown = function() {
            const selectedCat = document.getElementById('pCategory').value;
            const subs = globalData.subgroups || [];
            let html = '<option value="">Nenhum (Geral da Categoria)</option>';
            subs.filter(s => s.parent === selectedCat).forEach(s => {
                html += `<option value="${s.name}">${s.name}</option>`;
            });
            document.getElementById('pSubgroup').innerHTML = html;
        }

        window.saveProduct = function() {
            const editingId = document.getElementById('editingProductId').value;
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            const description = document.getElementById('pDescription').value;
            const category = document.getElementById('pCategory').value;
            const subgroup = document.getElementById('pSubgroup').value;

            if(!title || !price) {
                alert('Preencha ao menos o título e o preço.');
                return;
            }

            let image = selectedProductBase64;
            const urlInput = document.getElementById('pImage').value.trim();
            if (document.getElementById('product-url-section').style.display !== 'none' && urlInput) {
                image = urlInput;
            }

            if (editingId) {
                const existingProduct = globalData.products[editingId] || {};
                const finalExtras = currentEditingExtras.concat(selectedExtraBase64List);

                const updatedData = {
                    title,
                    price,
                    description,
                    category,
                    subgroup,
                    image: image || existingProduct.image || '',
                    extraImages: finalExtras,
                    code: existingProduct.code || ('#AMR-' + Math.floor(1000 + Math.random() * 9000))
                };

                update(ref(db, `amorim/products/${editingId}`), updatedData).then(() => {
                    alert('Peça atualizada com sucesso!');
                    cancelEdit();
                });
            } else {
                if (!image) {
                    alert('Por favor, adicione uma foto principal para a peça.');
                    return;
                }
                const newCode = '#AMR-' + Math.floor(1000 + Math.random() * 9000);
                const newProductRef = push(ref(db, 'amorim/products'));
                set(newProductRef, { 
                    title, 
                    price, 
                    description, 
                    image, 
                    extraImages: selectedExtraBase64List, 
                    category,
                    subgroup,
                    code: newCode
                }).then(() => {
                    alert(`Peça cadastrada com sucesso! Código gerado: ${newCode}`);
                    resetForm();
                });
            }
        }

        window.editProduct = function(id) {
            const p = globalData.products[id];
            if (!p) return;

            document.getElementById('editingProductId').value = id;
            document.getElementById('formHeading').innerText = 'Editar Peça';
            document.getElementById('saveProductBtn').innerText = 'Salvar Alterações';
            document.getElementById('cancelEditBtn').style.display = 'block';

            document.getElementById('pTitle').value = p.title || '';
            document.getElementById('pPrice').value = p.price || '';
            document.getElementById('pDescription').value = p.description || '';
            document.getElementById('pCategory').value = p.category || '';
            updateSubgroupDropdown();
            document.getElementById('pSubgroup').value = p.subgroup || '';
            
            if (p.image && !p.image.startsWith('data:')) {
                document.getElementById('pImage').value = p.image;
            } else {
                selectedProductBase64 = p.image || '';
            }

            currentEditingExtras = p.extraImages ? [...p.extraImages] : [];
            renderExistingExtras();

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEdit = function() {
            resetForm();
            document.getElementById('formHeading').innerText = 'Adicionar Nova Peça';
            document.getElementById('saveProductBtn').innerText = 'Cadastrar Peça';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function resetForm() {
            document.getElementById('editingProductId').value = '';
            document.getElementById('pTitle').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDescription').value = '';
            document.getElementById('pImage').value = '';
            document.getElementById('productFileInput').value = '';
            document.getElementById('productExtraFilesInput').value = '';
            document.getElementById('extraFilesPreview').innerText = '';
            selectedProductBase64 = "";
            selectedExtraBase64List = [];
            currentEditingExtras = [];
            document.getElementById('existingExtrasSection').style.display = 'none';
        }

        window.deleteProduct = function(id) {
            if(confirm('Deseja realmente excluir esta peça?')) {
                remove(ref(db, `amorim/products/${id}`));
            }
        }

        function renderCategoriesAndSubgroups() {
            const cats = globalData.categories || [];
            let catHtml = '';
            cats.forEach((cat, index) => {
                catHtml += `<div class="item-row"><span class="item-info"><strong>${cat}</strong></span><button class="btn-danger" onclick="deleteCategory(${index})"><i class="fa-solid fa-trash"></i></button></div>`;
            });
            document.getElementById('categoriesList').innerHTML = catHtml || '<p style="font-size:0.8rem;color:#777;">Nenhuma categoria cadastrada.</p>';

            let selectParentHtml = '<option value="">Selecione a Categoria Principal</option>';
            cats.forEach(cat => {
                selectParentHtml += `<option value="${cat}">${cat}</option>`;
            });
            document.getElementById('subgroupParentSelect').innerHTML = selectParentHtml;
            document.getElementById('pCategory').innerHTML = selectParentHtml;

            const subs = globalData.subgroups || [];
            let subHtml = '';
            subs.forEach((sub, index) => {
                subHtml += `<div class="item-row"><span class="item-info">${sub.name} <small style="color:#666;">(${sub.parent})</small></span><button class="btn-danger" onclick="deleteSubgroup(${index})"><i class="fa-solid fa-trash"></i></button></div>`;
            });
            document.getElementById('subgroupsList').innerHTML = subHtml || '<p style="font-size:0.8rem;color:#777;">Nenhum subgrupo criado.</p>';

            updateSubgroupDropdown();
        }

        window.deleteCategory = function(index) {
            let cats = globalData.categories || [];
            cats.splice(index, 1);
            set(ref(db, 'amorim/categories'), cats);
        }

        function renderProducts() {
            const prods = globalData.products || {};
            let html = '';
            Object.keys(prods).forEach(id => {
                const p = prods[id];
                const thumb = p.image ? `<img src="${p.image}" class="preview-thumb">` : '';
                html += `
                    <div class="item-row">
                        <div style="display:flex; align-items:center; gap:10px;">
                            ${thumb}
                            <div class="item-info">
                                <strong>${p.code || ''} - ${p.title}</strong> - ${p.price} <br><small style="color:#666;">(${p.category || 'Geral'} ${p.subgroup ? '➔ ' + p.subgroup : ''})</small>
                            </div>
                        </div>
                        <div style="display:flex; gap: 6px;">
                            <button class="btn-warning" onclick="editProduct('${id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-danger" onclick="deleteProduct('${id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('productsList').innerHTML = html || '<p style="font-size:0.8rem;color:#777;">Nenhuma peça cadastrada.</p>';
        }
    </script>
</body>
</html>
