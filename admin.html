<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOR.IM CERÂMICAS - Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-yellow: #FEFEF0;
            --primary-purple: #4A3A63;
            --accent-purple: #6B548E;
            --text-dark: #2D2438;
            --white: #FFFFFF;
            --shadow: 0 8px 24px rgba(74, 58, 99, 0.08);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-yellow);
            color: var(--text-dark);
            padding: 20px;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(74, 58, 99, 0.1);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-purple);
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--accent-purple);
            margin-bottom: 20px;
        }

        /* Sistema de Abas */
        .admin-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid rgba(74, 58, 99, 0.1);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-purple);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary-purple);
            color: var(--white);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Estilos comuns */
        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .form-label { font-size: 0.8rem; font-weight: 600; color: var(--primary-purple); }
        .form-input, .form-select, .form-textarea {
            padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(74, 58, 99, 0.2);
            background: var(--white); font-size: 0.85rem; outline: none; color: var(--text-dark);
            width: 100%;
        }
        .form-textarea { resize: vertical; min-height: 80px; }

        .btn-primary {
            background: var(--primary-purple); color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary:hover { opacity: 0.9; }

        /* Lista de Encomendas */
        .orders-list { display: flex; flex-direction: column; gap: 16px; }
        .order-card {
            background: var(--bg-yellow);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid rgba(74, 58, 99, 0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .order-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(74, 58, 99, 0.1);
            padding-bottom: 8px;
        }
        .order-id-date { font-size: 0.8rem; font-weight: 700; color: var(--accent-purple); }
        .order-status-badge {
            font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px;
            background: #e2dfcf; color: var(--primary-purple);
        }
        .order-status-badge.enviado { background: #d4edda; color: #155724; }
        .order-status-badge.saiu { background: #fff3cd; color: #856404; }

        .order-body {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 0.85rem;
        }
        @media(max-width: 600px) { .order-body { grid-template-columns: 1fr; } }
        
        .order-section-title { font-weight: 700; color: var(--primary-purple); margin-bottom: 4px; font-size: 0.85rem; }
        .checkbox-container {
            display: flex; align-items: center; gap: 6px; font-size: 0.82rem;
            color: var(--primary-purple); font-weight: 600; cursor: pointer; margin-top: 6px;
        }
        .checkbox-container input { cursor: pointer; accent-color: var(--primary-purple); width: 14px; height: 14px; }

        .loading { text-align: center; padding: 30px; color: var(--accent-purple); }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Painel Administrativo</h1>
        <p class="subtitle">Gestão completa do catálogo, grupos e controle de encomendas.</p>

        <!-- Menu de Abas -->
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('encomendas')"><i class="fa-solid fa-box-archive"></i> Encomendas & Rastreio</button>
            <button class="tab-btn" onclick="switchTab('catalogo')"><i class="fa-solid fa-mug-hot"></i> Gerenciar Catálogo & Produtos</button>
        </div>

        <!-- ABA 1: GERENCIAMENTO DE ENCOMENDAS -->
        <div id="tab-encomendas" class="tab-content active">
            <h2 style="font-size: 1.2rem; color: var(--primary-purple); margin-bottom: 14px;">Controle de Encomendas (Do mais antigo para o mais novo)</h2>
            <div class="orders-list" id="ordersListContainer">
                <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> A carregar encomendas...</div>
            </div>
        </div>

        <!-- ABA 2: GERENCIAMENTO DO CATÁLOGO (PRODUTOS E GRUPOS) -->
        <div id="tab-catalogo" class="tab-content">
            <h2 style="font-size: 1.2rem; color: var(--primary-purple); margin-bottom: 14px;">Cadastro e Gestão de Peças</h2>
            <form id="productForm" onsubmit="salvarProduto(event)">
                <input type="hidden" id="editProductId">
                <div class="form-group">
                    <label class="form-label">Título da Peça:</label>
                    <input type="text" id="prodTitle" class="form-input" required placeholder="Ex: Xícara Afetiva">
                </div>
                <div class="form-group">
                    <label class="form-label">Código da Peça:</label>
                    <input type="text" id="prodCode" class="form-input" placeholder="Ex: C01">
                </div>
                <div class="form-group">
                    <label class="form-label">Preço (R$):</label>
                    <input type="text" id="prodPrice" class="form-input" required placeholder="Ex: R$ 65,00">
                </div>
                <div class="form-group">
                    <label class="form-label">Categoria:</label>
                    <input type="text" id="prodCategory" class="form-input" required placeholder="Ex: Utensílios">
                </div>
                <div class="form-group">
                    <label class="form-label">Subgrupo:</label>
                    <input type="text" id="prodSubgroup" class="form-input" placeholder="Ex: Canecas">
                </div>
                <div class="form-group">
                    <label class="form-label">Link da Imagem Principal:</label>
                    <input type="url" id="prodImage" class="form-input" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label class="form-label">Descrição / Detalhes e Medidas:</label>
                    <textarea id="prodDesc" class="form-textarea" placeholder="Descreva os detalhes e medidas da peça..."></textarea>
                </div>
                <button type="submit" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i> Salvar Peça</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-9EgZW2PsJ3A1lwghkx8x5tjC6kd1dJg",
            authDomain: "amorimceramicas.firebaseapp.com",
            databaseURL: "https://amorimceramicas-default-rtdb.firebaseio.com",
            projectId: "amorimceramicas",
            storageBucket: "amorimceramicas.firebasestorage.app",
            messagingSenderId: "805924176382",
            appId: "1:805924176382:web:f9766ef6c7c43561f940af",
            measurementId: "G-8XQB9YEBRM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Função de alternar abas
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'encomendas') {
                document.getElementById('tab-encomendas').classList.add('active');
                event.currentTarget.classList.add('active');
            } else {
                document.getElementById('tab-catalogo').classList.add('active');
                event.currentTarget.classList.add('active');
            }
        }

        // Carrega Encomendas ordenadas do mais antigo para o mais novo
        const ordersRef = ref(db, 'amorim/orders');
        onValue(ordersRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('ordersListContainer');

            if (!data) {
                container.innerHTML = '<div class="loading">Nenhuma encomenda registrada ainda.</div>';
                return;
            }

            let ordersArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            ordersArray.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

            let html = '';
            ordersArray.forEach(order => {
                const dateStr = order.date || 'Data não informada';
                const status = order.status || 'Pendente de Envio';
                const isOwnDelivery = order.isOwnDelivery || false;
                const trackingCode = order.trackingCode || '';
                const trackingStatus = order.trackingStatus || 'Aguardando postagem';

                let badgeClass = '';
                if (status.includes('Enviado')) badgeClass = 'enviado';
                else if (status.includes('Saiu')) badgeClass = 'saiu';

                let itemsHtml = '';
                if (order.items && Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        itemsHtml += `• ${item.quantity || 1}x ${item.title} (${item.price}) [Cód: ${item.code || 'N/A'}]<br>`;
                    });
                }

                html += `
                    <div class="order-card">
                        <div class="order-header-row">
                            <span class="order-id-date"><i class="fa-regular fa-clock"></i> ${dateStr} (ID: ${order.id.slice(-6)})</span>
                            <span class="order-status-badge ${badgeClass}">${status}</span>
                        </div>

                        <div class="order-body">
                            <div>
                                <div class="order-section-title">Itens do Pedido:</div>
                                <div style="margin-bottom: 8px;">${itemsHtml}</div>
                                <div class="order-section-title">Endereço de Entrega:</div>
                                <div>${order.address || 'Não informado'}</div>
                            </div>

                            <div>
                                <div class="order-section-title">Gestão de Envio:</div>
                                
                                <label class="checkbox-container">
                                    <input type="checkbox" id="own-${order.id}" ${isOwnDelivery ? 'checked' : ''} onchange="toggleOwnDelivery('${order.id}')"> Entrega Própria / Retirada
                                </label>

                                <div class="form-group" id="transportadora-group-${order.id}" style="display: ${isOwnDelivery ? 'none' : 'flex'}; margin-top: 8px;">
                                    <label class="form-label">Código de Rastreio:</label>
                                    <input type="text" class="form-input" id="track-${order.id}" value="${trackingCode}" placeholder="Ex: AB123456789BR">
                                </div>

                                <div class="form-group" style="margin-top: 8px;">
                                    <label class="form-label">Status Passo a Passo:</label>
                                    <select class="form-select" id="tstatus-${order.id}">
                                        <option value="Aguardando postagem" ${trackingStatus === 'Aguardando postagem' ? 'selected' : ''}>Aguardando postagem</option>
                                        <option value="Em trânsito na transportadora" ${trackingStatus === 'Em trânsito na transportadora' ? 'selected' : ''}>Em trânsito na transportadora</option>
                                        <option value="Saiu para entrega ao destinatário" ${trackingStatus === 'Saiu para entrega ao destinatário' ? 'selected' : ''}>Saiu para entrega ao destinatário</option>
                                        <option value="Entregue com sucesso" ${trackingStatus === 'Entregue com sucesso' ? 'selected' : ''}>Entregue com sucesso</option>
                                        <option value="Entrega própria realizada" ${trackingStatus === 'Entrega própria realizada' ? 'selected' : ''}>Entrega própria realizada</option>
                                    </select>
                                </div>

                                <button class="btn-primary" onclick="salvarEnvio('${order.id}')" style="margin-top: 6px; padding: 7px 14px; font-size: 0.8rem;">
                                    <i class="fa-solid fa-paper-plane"></i> Atualizar Envio
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        });

        window.toggleOwnDelivery = function(orderId) {
            const isChecked = document.getElementById(`own-${orderId}`).checked;
            const transpGroup = document.getElementById(`transportadora-group-${orderId}`);
            if (isChecked) transpGroup.style.display = 'none';
            else transpGroup.style.display = 'flex';
        }

        window.salvarEnvio = function(orderId) {
            const isOwn = document.getElementById(`own-${orderId}`).checked;
            const trackingInput = document.getElementById(`track-${orderId}`);
            const tstatusSelect = document.getElementById(`tstatus-${orderId}`);

            const trackingCode = isOwn ? 'Entrega Própria' : (trackingInput ? trackingInput.value.trim() : '');
            const trackingStatus = tstatusSelect.value;
            
            let finalStatus = trackingStatus;
            if (isOwn) {
                finalStatus = trackingStatus.includes('realizada') ? 'Entrega Própria Concluída' : 'Saiu para Entrega Própria';
            } else {
                finalStatus = `Enviado (${trackingStatus})`;
            }

            const orderUpdateRef = ref(db, `amorim/orders/${orderId}`);
            update(orderUpdateRef, {
                isOwnDelivery: isOwn,
                trackingCode: trackingCode,
                trackingStatus: trackingStatus,
                status: finalStatus
            }).then(() => {
                alert('Informações de envio atualizadas com sucesso!');
            }).catch((error) => {
                alert('Erro ao atualizar: ' + error.message);
            });
        }

        // Função de cadastro de produtos
        window.salvarProduto = function(event) {
            event.preventDefault();
            const title = document.getElementById('prodTitle').value;
            const code = document.getElementById('prodCode').value;
            const price = document.getElementById('prodPrice').value;
            const category = document.getElementById('prodCategory').value;
            const subgroup = document.getElementById('prodSubgroup').value;
            const image = document.getElementById('prodImage').value;
            const description = document.getElementById('prodDesc').value;

            const newProdRef = push(ref(db, 'amorim/products'));
            set(newProdRef, { title, code, price, category, subgroup, image, description }).then(() => {
                alert('Peça cadastrada com sucesso!');
                document.getElementById('productForm').reset();
            }).catch(err => alert('Erro ao cadastrar: ' + err.message));
        }
    </script>
</body>
</html>
