<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOR.IM CERÂMICAS - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-yellow: #FEFEF0;
            --primary-purple: #4A3A63;
            --accent-purple: #6B548E;
            --text-dark: #2D2438;
            --white: #FFFFFF;
            --shadow: 0 8px 24px rgba(74, 58, 99, 0.08);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-yellow);
            color: var(--text-dark);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .admin-container {
            width: 100%;
            max-width: 600px;
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(74, 58, 99, 0.1);
            height: fit-content;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-purple);
            font-size: 1.6rem;
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--accent-purple);
            margin-bottom: 20px;
            text-align: center;
        }

        .section-box {
            background: var(--bg-yellow);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(74, 58, 99, 0.1);
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: var(--primary-purple);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .form-label { font-size: 0.78rem; font-weight: 600; color: var(--primary-purple); }
        .form-input, .form-select, .form-textarea {
            padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(74, 58, 99, 0.2);
            background: var(--white); font-size: 0.85rem; outline: none; color: var(--text-dark);
            width: 100%;
        }
        .form-textarea { resize: vertical; min-height: 70px; }

        .btn-primary {
            background: var(--primary-purple); color: white; border: none; padding: 10px 16px;
            border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
            margin-top: 6px;
            -webkit-appearance: none;
        }
        .btn-primary:hover { opacity: 0.9; }

        .products-list-admin {
            display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; margin-top: 10px;
        }
        .product-admin-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--white); padding: 8px 12px; border-radius: 8px;
            font-size: 0.82rem; border: 1px solid rgba(74, 58, 99, 0.08);
        }
        .product-admin-actions { display: flex; gap: 6px; }
        .action-btn {
            background: transparent; border: none; cursor: pointer; font-size: 0.85rem; padding: 4px;
        }
        .edit-btn { color: var(--primary-purple); }
        .delete-btn { color: #d9534f; }

        .loading { text-align: center; padding: 20px; color: var(--accent-purple); font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Painel Administrativo</h1>
        <p class="subtitle">AMOR.IM CERÂMICAS</p>

        <!-- CONFIGURAÇÃO DA LOGO -->
        <div class="section-box">
            <h2 class="section-title"><i class="fa-solid fa-image"></i> Logotipo do Catálogo</h2>
            <div class="form-group">
                <label class="form-label">Link da Nova Logo (URL Direta / Firebase):</label>
                <input type="url" id="inputLogoUrl" class="form-input" placeholder="https://...">
            </div>
            <button class="btn-primary" onclick="salvarLogo()"><i class="fa-solid fa-floppy-disk"></i> Atualizar Logo</button>
        </div>

        <!-- CADASTRO / EDIÇÃO DE PRODUTOS -->
        <div class="section-box">
            <h2 class="section-title" id="formSectionTitle"><i class="fa-solid fa-plus-circle"></i> Cadastrar Nova Peça</h2>
            <form id="productForm" onsubmit="salvarProduto(event)">
                <input type="hidden" id="editProductId">
                
                <div class="form-group">
                    <label class="form-label">Título da Peça:</label>
                    <input type="text" id="prodTitle" class="form-input" required placeholder="Ex: Xícara Afetiva">
                </div>
                <div class="form-group">
                    <label class="form-label">Código da Peça:</label>
                    <input type="text" id="prodCode" class="form-input" placeholder="Ex: C01">
                </div>
                <div class="form-group">
                    <label class="form-label">Preço:</label>
                    <input type="text" id="prodPrice" class="form-input" required placeholder="Ex: R$ 65,00">
                </div>
                <div class="form-group">
                    <label class="form-label">Categoria (Ex: Utensílios, Decoração):</label>
                    <input type="text" id="prodCategory" class="form-input" required placeholder="Categoria principal">
                </div>
                <div class="form-group">
                    <label class="form-label">Subgrupo (Ex: Canecas, Pratos):</label>
                    <input type="text" id="prodSubgroup" class="form-input" placeholder="Subgrupo opcional">
                </div>
                <div class="form-group">
                    <label class="form-label">Link da Imagem Principal:</label>
                    <input type="url" id="prodImage" class="form-input" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label class="form-label">Detalhes e Medidas (Descrição):</label>
                    <textarea id="prodDesc" class="form-textarea" placeholder="Descreva as medidas, capacidade ou detalhes da peça..."></textarea>
                </div>

                <button type="submit" class="btn-primary" id="btnSalvarProd"><i class="fa-solid fa-check"></i> Salvar Peça</button>
                <button type="button" id="btnCancelarEdicao" class="btn-primary" onclick="cancelarEdicao()" style="background: #d9534f; display: none; margin-top: 6px;">Cancelar Edição</button>
            </form>
        </div>

        <!-- LISTA DE PEÇAS CADASTRADAS -->
        <div class="section-box">
            <h2 class="section-title"><i class="fa-solid fa-boxes-stacked"></i> Peças Cadastradas</h2>
            <div class="products-list-admin" id="adminProductsList">
                <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> A carregar peças...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-9EgZW2PsJ3A1lwghkx8x5tjC6kd1dJg",
            authDomain: "amorimceramicas.firebaseapp.com",
            databaseURL: "https://amorimceramicas-default-rtdb.firebaseio.com",
            projectId: "amorimceramicas",
            storageBucket: "amorimceramicas.firebasestorage.app",
            messagingSenderId: "805924176382",
            appId: "1:805924176382:web:f9766ef6c7c43561f940af",
            measurementId: "G-8XQB9YEBRM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = [];

        const dataRef = ref(db, 'amorim');
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.logo) {
                    document.getElementById('inputLogoUrl').value = data.logo;
                }
                allProducts = data.products ? Object.keys(data.products).map(key => ({ id: key, ...data.products[key] })) : [];
                renderAdminProductsList();
            } else {
                document.getElementById('adminProductsList').innerHTML = '<div class="loading">Nenhuma peça cadastrada.</div>';
            }
        });

        window.salvarLogo = function() {
            const logoUrl = document.getElementById('inputLogoUrl').value.trim();
            if (!logoUrl) {
                alert('Por favor, informe o link da logo.');
                return;
            }
            const logoRef = ref(db, 'amorim');
            update(logoRef, { logo: logoUrl }).then(() => {
                alert('Logotipo atualizado com sucesso!');
            }).catch(err => alert('Erro ao atualizar logo: ' + err.message));
        }

        window.salvarProduto = function(event) {
            event.preventDefault();
            const editId = document.getElementById('editProductId').value;
            const title = document.getElementById('prodTitle').value.trim();
            const code = document.getElementById('prodCode').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const category = document.getElementById('prodCategory').value.trim();
            const subgroup = document.getElementById('prodSubgroup').value.trim();
            const image = document.getElementById('prodImage').value.trim();
            const description = document.getElementById('prodDesc').value.trim();

            const productData = { title, code, price, category, subgroup, image, description };

            if (editId) {
                const prodRef = ref(db, `amorim/products/${editId}`);
                update(prodRef, productData).then(() => {
                    alert('Peça atualizada com sucesso!');
                    cancelarEdicao();
                }).catch(err => alert('Erro ao atualizar: ' + err.message));
            } else {
                const newProdRef = push(ref(db, 'amorim/products'));
                set(newProdRef, productData).then(() => {
                    alert('Peça cadastrada com sucesso!');
                    document.getElementById('productForm').reset();
                }).catch(err => alert('Erro ao cadastrar: ' + err.message));
            }
        }

        function renderAdminProductsList() {
            const container = document.getElementById('adminProductsList');
            if (allProducts.length === 0) {
                container.innerHTML = '<div class="loading">Nenhuma peça cadastrada.</div>';
                return;
            }

            let html = '';
            allProducts.forEach(p => {
                html += `
                    <div class="product-admin-row">
                        <span><b>${p.title}</b> (${p.price})</span>
                        <div class="product-admin-actions">
                            <button class="action-btn edit-btn" onclick="prepararEdicao('${p.id}')" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button class="action-btn delete-btn" onclick="deletarProduto('${p.id}')" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.prepararEdicao = function(id) {
            const p = allProducts.find(item => item.id === id);
            if (!p) return;

            document.getElementById('editProductId').value = p.id;
            document.getElementById('prodTitle').value = p.title || '';
            document.getElementById('prodCode').value = p.code || '';
            document.getElementById('prodPrice').value = p.price || '';
            document.getElementById('prodCategory').value = p.category || '';
            document.getElementById('prodSubgroup').value = p.subgroup || '';
            document.getElementById('prodImage').value = p.image || '';
            document.getElementById('prodDesc').value = p.description || '';

            document.getElementById('formSectionTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Editar Peça';
            document.getElementById('btnSalvarProd').innerHTML = '<i class="fa-solid fa-check"></i> Atualizar Peça';
            document.getElementById('btnCancelarEdicao').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelarEdicao = function() {
            document.getElementById('editProductId').value = '';
            document.getElementById('productForm').reset();
            document.getElementById('formSectionTitle').innerHTML = '<i class="fa-solid fa-plus-circle"></i> Cadastrar Nova Peça';
            document.getElementById('btnSalvarProd').innerHTML = '<i class="fa-solid fa-check"></i> Salvar Peça';
            document.getElementById('btnCancelarEdicao').style.display = 'none';
        }

        window.deletarProduto = function(id) {
            if (confirm('Deseja realmente excluir esta peça?')) {
                const prodRef = ref(db, `amorim/products/${id}`);
                remove(prodRef).then(() => {
                    alert('Peça excluída com sucesso!');
                }).catch(err => alert('Erro ao excluir: ' + err.message));
            }
        }
    </script>
</body>
</html>
