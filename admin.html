<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - AMOR.IM CERÂMICAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-yellow: #FEFEF0;
            --primary-purple: #4A3A63;
            --accent-purple: #6B548E;
            --text-dark: #2D2438;
            --white: #FFFFFF;
            --danger: #d9534f;
            --success: #5cb85c;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-yellow); color: var(--text-dark); padding: 20px; max-width: 600px; margin: 0 auto; }

        h1, h2 { color: var(--primary-purple); margin-bottom: 16px; }
        .card { background: var(--white); padding: 20px; border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,0.05); margin-bottom: 20px; }

        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--primary-purple); }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 14px; font-size: 0.9rem; }
        
        button { background: var(--primary-purple); color: var(--white); border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        button:hover { background: var(--accent-purple); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; gap: 10px; }
        .item-info { font-size: 0.85rem; }
        .flex { display: flex; gap: 10px; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .preview-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 8px; }
        .tab-btn { background: #eee; color: var(--text-dark); border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .tab-btn.active { background: var(--primary-purple); color: white; }
    </style>
</head>
<body>

    <div class="top-nav">
        <h1>Painel Admin 🎨</h1>
        <a href="index.html" target="_blank" style="color: var(--primary-purple); font-weight: 600; font-size: 0.9rem; text-decoration: none;"><i class="fa-solid fa-eye"></i> Ver Site</a>
    </div>
    
    <!-- Configuração da Logo -->
    <div class="card">
        <h2>Logo do Ateliê</h2>
        <div class="tab-buttons">
            <button type="button" class="tab-btn active" onclick="switchTab('logo', 'file')">Arquivo</button>
            <button type="button" class="tab-btn" onclick="switchTab('logo', 'url')">Link da Imagem</button>
        </div>
        <div id="logo-file-section">
            <label>Selecionar Ficheiro da Logo</label>
            <input type="file" id="logoFileInput" accept="image/*" onchange="previewLogoFile(this)">
        </div>
        <div id="logo-url-section" style="display:none;">
            <label>URL da Imagem da Logo</label>
            <input type="text" id="logoUrlInput" placeholder="https://exemplo.com/logo.jpg">
        </div>
        <button onclick="saveLogo()" style="margin-top: 10px; width: 100%;">Salvar Logo</button>
    </div>

    <!-- Gerenciar Categorias -->
    <div class="card">
        <h2>Categorias</h2>
        <div class="flex">
            <input type="text" id="newCategoryInput" placeholder="Nova Categoria (ex: Copos)">
            <button onclick="addCategory()">Adicionar</button>
        </div>
        <div id="categoriesList">A carregar...</div>
    </div>

    <!-- Gerenciar Peças -->
    <div class="card">
        <h2>Adicionar Nova Peça</h2>
        <label>Título da Peça</label>
        <input type="text" id="pTitle" placeholder="Ex: Caneca Coração">
        
        <label>Preço</label>
        <input type="text" id="pPrice" placeholder="Ex: 85,00" oninput="formatCurrency(this)">
        
        <div class="tab-buttons" style="margin-top: 10px;">
            <button type="button" class="tab-btn active" onclick="switchTab('product', 'file')">Arquivo</button>
            <button type="button" class="tab-btn" onclick="switchTab('product', 'url')">Link da Imagem</button>
        </div>
        <div id="product-file-section">
            <label>Foto da Peça (Dispositivo)</label>
            <input type="file" id="productFileInput" accept="image/*" onchange="previewProductFile(this)">
        </div>
        <div id="product-url-section" style="display:none;">
            <label>URL da Foto da Peça</label>
            <input type="text" id="pImage" placeholder="https://exemplo.com/foto.jpg">
        </div>
        
        <label style="margin-top: 10px;">Categoria</label>
        <select id="pCategory"></select>
        
        <button onclick="addProduct()" class="btn-success" style="width:100%; margin-top: 10px;">Cadastrar Peça</button>
    </div>

    <!-- Lista de Peças Cadastradas -->
    <div class="card">
        <h2>Peças Cadastradas</h2>
        <div id="productsList">A carregar...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-9EgZW2PsJ3A1lwghkx8x5tjC6kd1dJg",
            authDomain: "amorimceramicas.firebaseapp.com",
            databaseURL: "https://amorimceramicas-default-rtdb.firebaseio.com",
            projectId: "amorimceramicas",
            storageBucket: "amorimceramicas.firebasestorage.app",
            messagingSenderId: "805924176382",
            appId: "1:805924176382:web:f9766ef6c7c43561f940af",
            measurementId: "G-8XQB9YEBRM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalData = {};
        let selectedLogoBase64 = "";
        let selectedProductBase64 = "";

        const dataRef = ref(db, 'amorim');
        onValue(dataRef, (snapshot) => {
            globalData = snapshot.val() || { categories: [], products: {}, logo: "" };
            
            document.getElementById('logoUrlInput').value = globalData.logo || '';
            if (globalData.logo && globalData.logo.startsWith('data:')) {
                selectedLogoBase64 = globalData.logo;
            }
            renderCategories();
            renderProducts();
        });

        window.formatCurrency = function(input) {
            let value = input.value.replace(/\D/g, "");
            if (!value) {
                input.value = "";
                return;
            }
            value = (Number(value) / 100).toFixed(2) + "";
            value = value.replace(".", ",");
            value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            input.value = "R$ " + value;
        }

        window.switchTab = function(type, mode) {
            const fileSec = document.getElementById(`${type}-file-section`);
            const urlSec = document.getElementById(`${type}-url-section`);
            const buttons = fileSec.parentElement.querySelectorAll('.tab-btn');
            
            buttons.forEach(b => b.classList.remove('active'));
            if(mode === 'file') {
                fileSec.style.display = 'block';
                urlSec.style.display = 'none';
                event.target.classList.add('active');
            } else {
                fileSec.style.display = 'none';
                urlSec.style.display = 'block';
                event.target.classList.add('active');
            }
        }

        window.previewLogoFile = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedLogoBase64 = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        window.previewProductFile = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedProductBase64 = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        window.saveLogo = function() {
            let logoToSave = selectedLogoBase64;
            const urlInput = document.getElementById('logoUrlInput').value.trim();
            if (document.getElementById('logo-url-section').style.display !== 'none' && urlInput) {
                logoToSave = urlInput;
            }

            set(ref(db, 'amorim/logo'), logoToSave).then(() => alert('Logo atualizada com sucesso!'));
        }

        window.addCategory = function() {
            const catName = document.getElementById('newCategoryInput').value.trim();
            if(!catName) return;
            let cats = globalData.categories || [];
            if(!cats.includes(catName)) {
                cats.push(catName);
                set(ref(db, 'amorim/categories'), cats).then(() => {
                    document.getElementById('newCategoryInput').value = '';
                    alert('Categoria adicionada!');
                });
            }
        }

        window.deleteCategory = function(index) {
            let cats = globalData.categories || [];
            cats.splice(index, 1);
            set(ref(db, 'amorim/categories'), cats);
        }

        window.addProduct = function() {
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            let image = selectedProductBase64;
            
            const urlInput = document.getElementById('pImage').value.trim();
            if (document.getElementById('product-url-section').style.display !== 'none' && urlInput) {
                image = urlInput;
            }

            const category = document.getElementById('pCategory').value;

            if(!title || !price) {
                alert('Preencha ao menos o título e o preço.');
                return;
            }

            const newProductRef = push(ref(db, 'amorim/products'));
            set(newProductRef, { title, price, image, category }).then(() => {
                document.getElementById('pTitle').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pImage').value = '';
                document.getElementById('productFileInput').value = '';
                selectedProductBase64 = "";
                alert('Peça cadastrada com sucesso!');
            });
        }

        window.deleteProduct = function(id) {
            if(confirm('Deseja realmente excluir esta peça?')) {
                remove(ref(db, `amorim/products/${id}`));
            }
        }

        function renderCategories() {
            const cats = globalData.categories || [];
            let html = '';
            cats.forEach((cat, index) => {
                html += `<div class="item-row"><span class="item-info">${cat}</span><button class="btn-danger" onclick="deleteCategory(${index})"><i class="fa-solid fa-trash"></i></button></div>`;
            });
            document.getElementById('categoriesList').innerHTML = html || '<p style="font-size:0.8rem;color:#777;">Nenhuma categoria extra.</p>';

            let selectHTML = '<option value="">Geral</option>';
            cats.forEach(cat => {
                selectHTML += `<option value="${cat}">${cat}</option>`;
            });
            document.getElementById('pCategory').innerHTML = selectHTML;
        }

        function renderProducts() {
            const prods = globalData.products || {};
            let html = '';
            Object.keys(prods).forEach(id => {
                const p = prods[id];
                const thumb = p.image ? `<img src="${p.image}" class="preview-thumb">` : '';
                html += `
                    <div class="item-row">
                        <div style="display:flex; align-items:center; gap:10px;">
                            ${thumb}
                            <div class="item-info">
                                <strong>${p.title}</strong> - ${p.price} <br><small style="color:#666;">(${p.category || 'Geral'})</small>
                            </div>
                        </div>
                        <button class="btn-danger" onclick="deleteProduct('${id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            document.getElementById('productsList').innerHTML = html || '<p style="font-size:0.8rem;color:#777;">Nenhuma peça cadastrada.</p>';
        }
    </script>
</body>
</html>
