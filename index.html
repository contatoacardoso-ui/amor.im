<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOR.IM CERÂMICAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-yellow: #FEFEF0;
            --primary-purple: #4A3A63;
            --accent-purple: #6B548E;
            --text-dark: #2D2438;
            --white: #FFFFFF;
            --shadow: 0 8px 24px rgba(74, 58, 99, 0.08);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-yellow);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-image: 
                linear-gradient(45deg, rgba(240, 235, 210, 0.3) 25%, transparent 25%), 
                linear-gradient(-45deg, rgba(240, 235, 210, 0.3) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, rgba(240, 235, 210, 0.3) 75%), 
                linear-gradient(-45deg, transparent 75%, rgba(240, 235, 210, 0.3) 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-yellow);
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 24px 20px 16px 20px;
            text-align: center;
            background: rgba(254, 254, 240, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(74, 58, 99, 0.1);
        }

        .logo-img { max-width: 120px; height: auto; margin-bottom: 12px; border-radius: 12px; object-fit: contain; cursor: pointer; }
        .brand-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--primary-purple); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; cursor: pointer; }
        .brand-sub { font-size: 0.85rem; color: var(--accent-purple); font-weight: 500; }

        /* Controles do Topo (Categorias + Lupa) */
        .top-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px 8px 20px;
            gap: 10px;
        }
        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; flex-grow: 1; }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--white);
            border: 1px solid rgba(74, 58, 99, 0.2);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-purple);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn.active { background: var(--primary-purple); color: var(--white); border-color: var(--primary-purple); }

        .search-icon-btn {
            background: var(--white);
            border: 1px solid rgba(74, 58, 99, 0.2);
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary-purple); cursor: pointer; font-size: 0.8rem;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .search-icon-btn:hover { background: var(--primary-purple); color: white; }

        /* Gaveta Oculta de Busca e Subgrupos */
        .search-drawer {
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
            padding: 0 20px; background: rgba(74, 58, 99, 0.03); border-bottom: 1px solid rgba(74, 58, 99, 0.06);
        }
        .search-drawer.open { max-height: 120px; padding: 8px 20px 12px 20px; }
        
        .search-input {
            width: 100%; padding: 6px 12px; border-radius: 14px; border: 1px solid rgba(74, 58, 99, 0.2);
            background: var(--white); font-size: 0.8rem; outline: none; color: var(--text-dark);
            margin-bottom: 8px;
        }

        .subgroups-bar {
            display: none; gap: 6px; overflow-x: auto; padding-top: 4px; scrollbar-width: none;
        }
        .subgroups-bar::-webkit-scrollbar { display: none; }
        .sub-btn {
            background: transparent; border: 1px dashed var(--accent-purple);
            padding: 3px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600;
            color: var(--accent-purple); white-space: nowrap; cursor: pointer;
        }
        .sub-btn.active { background: var(--accent-purple); color: white; border-style: solid; }

        .products-grid { padding: 16px 20px 40px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(74, 58, 99, 0.08);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .product-card:hover { transform: translateY(-2px); }

        .product-img-wrapper { width: 100%; height: 160px; background: #f5f3e7; position: relative; overflow: hidden; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }

        .product-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .product-code { font-size: 0.7rem; color: var(--accent-purple); font-weight: 600; margin-bottom: 2px; }
        .product-title { font-size: 0.9rem; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; line-height: 1.2; }
        .product-price { font-size: 0.85rem; font-weight: 600; color: var(--accent-purple); margin-bottom: 6px; }
        .product-snippet { font-size: 0.75rem; color: #666; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .whatsapp-btn:hover { background: #20ba5a; }

        .detail-view { padding: 20px; display: none; }
        .back-link {
            background: var(--white); border: 1px solid rgba(74, 58, 99, 0.2); font-size: 0.85rem; color: var(--primary-purple);
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 16px;
            padding: 6px 14px; border-radius: 20px; transition: background 0.2s;
        }
        .back-link:hover { background: var(--primary-purple); color: white; }

        .main-img-box {
            width: 100%; height: 320px; border-radius: var(--radius); overflow: hidden;
            background: #f5f3e7; box-shadow: var(--shadow); margin-bottom: 16px;
        }
        .main-img { width: 100%; height: 100%; object-fit: cover; }

        .gallery-scroll {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none;
        }
        .gallery-scroll::-webkit-scrollbar { display: none; }

        .thumb-box {
            width: 70px; height: 70px; border-radius: 10px; overflow: hidden; flex-shrink: 0;
            cursor: pointer; border: 2px solid transparent; background: #f5f3e7;
        }
        .thumb-box.active { border-color: var(--primary-purple); }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }

        .piece-code-tag { font-size: 0.8rem; font-weight: 600; color: var(--accent-purple); margin-bottom: 4px; }
        .piece-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--primary-purple); margin-bottom: 6px; }
        .piece-price { font-size: 1.2rem; font-weight: 700; color: var(--accent-purple); margin-bottom: 20px; }

        .card-info {
            background: var(--white); padding: 16px; border-radius: var(--radius);
            box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid rgba(74, 58, 99, 0.08);
        }
        .card-info h3 { font-size: 0.95rem; color: var(--primary-purple); margin-bottom: 8px; }
        .card-info p { font-size: 0.9rem; line-height: 1.5; color: var(--text-dark); white-space: pre-wrap; }

        .whatsapp-btn-large {
            background: #25D366; color: white; border: none; border-radius: 12px; padding: 14px;
            font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
            gap: 10px; text-decoration: none; cursor: pointer; box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
            transition: background 0.2s; width: 100%;
        }
        .whatsapp-btn-large:hover { background: #20ba5a; }

        footer { margin-top: auto; text-align: center; padding: 20px; font-size: 0.75rem; color: var(--accent-purple); border-top: 1px solid rgba(74, 58, 99, 0.1); }
        .loading { text-align: center; padding: 40px; color: var(--accent-purple); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Cabeçalho Fixo -->
        <header>
            <img id="headerLogo" src="" alt="Logo Amor.im" class="logo-img" style="display:none;" onclick="goHome()">
            <h1 class="brand-title" onclick="goHome()">AMOR.IM CERÂMICAS</h1>
            <p class="brand-sub">Arte em cerâmica afetiva</p>
        </header>

        <!-- SEÇÃO 1: Vitrine Principal -->
        <div id="homeView">
            <div class="top-controls">
                <div class="categories-scroll" id="categoriesContainer">
                    <button class="cat-btn active" onclick="filterCategory('Todas')">Todas</button>
                </div>
                <button class="search-icon-btn" onclick="toggleSearch()" title="Pesquisar / Subgrupos"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <!-- Gaveta de Busca + Subgrupos Unidos -->
            <div class="search-drawer" id="searchDrawer">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nome ou código..." oninput="filterProducts()">
                <div class="subgroups-bar" id="subgroupsBar"></div>
            </div>
            
            <div class="products-grid" id="productsGrid">
                <div class="loading" style="grid-column: span 2;"><i class="fa-solid fa-spinner fa-spin"></i> A carregar peças...</div>
            </div>
        </div>

        <!-- SEÇÃO 2: Página de Detalhes da Peça -->
        <div id="detailView" class="detail-view">
            <button class="back-link" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> Voltar ao catálogo</button>
            <div id="detailContent"></div>
        </div>

        <!-- Rodapé de Contato -->
        <footer>
            <p>@AMORIMCERAMICAS | (21) 99477-8733</p>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-9EgZW2PsJ3A1lwghkx8x5tjC6kd1dJg",
            authDomain: "amorimceramicas.firebaseapp.com",
            databaseURL: "https://amorimceramicas-default-rtdb.firebaseio.com",
            projectId: "amorimceramicas",
            storageBucket: "amorimceramicas.firebasestorage.app",
            messagingSenderId: "805924176382",
            appId: "1:805924176382:web:f9766ef6c7c43561f940af",
            measurementId: "G-8XQB9YEBRM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = [];
        let allSubgroups = [];
        let currentCategory = 'Todas';
        let currentSubgroup = 'Todos';

        const dataRef = ref(db, 'amorim');
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.logo) {
                    const logoImg = document.getElementById('headerLogo');
                    logoImg.src = data.logo;
                    logoImg.style.display = 'inline-block';
                }

                allSubgroups = data.subgroups || [];

                const catContainer = document.getElementById('categoriesContainer');
                let catHTML = `<button class="cat-btn ${currentCategory === 'Todas' ? 'active' : ''}" onclick="filterCategory('Todas')">Todas</button>`;
                
                if (data.categories) {
                    data.categories.forEach(cat => {
                        catHTML += `<button class="cat-btn ${currentCategory === cat ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</button>`;
                    });
                }
                catContainer.innerHTML = catHTML;

                allProducts = data.products ? Object.keys(data.products).map(key => ({ id: key, ...data.products[key] })) : [];
                updateSubgroupsBar();
                filterProducts();
            } else {
                document.getElementById('productsGrid').innerHTML = '<div class="loading" style="grid-column: span 2;">Nenhuma peça cadastrada ainda.</div>';
            }
        });

        window.toggleSearch = function() {
            const drawer = document.getElementById('searchDrawer');
            drawer.classList.toggle('open');
            if (drawer.classList.contains('open')) {
                document.getElementById('searchInput').focus();
            } else {
                // Se fechar a busca, limpa o texto e o filtro de subgrupo opcionalmente
                document.getElementById('searchInput').value = '';
                filterProducts();
            }
        }

        window.filterCategory = function(cat) {
            currentCategory = cat;
            currentSubgroup = 'Todos';
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.textContent === cat) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            updateSubgroupsBar();
            filterProducts();
        }

        function updateSubgroupsBar() {
            const bar = document.getElementById('subgroupsBar');
            const matchingSubs = allSubgroups.filter(s => s.parent === currentCategory);

            if (currentCategory === 'Todas' || matchingSubs.length === 0) {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }

            let html = `<button class="sub-btn ${currentSubgroup === 'Todos' ? 'active' : ''}" onclick="filterSubgroup('Todos')">Todos</button>`;
            matchingSubs.forEach(sub => {
                html += `<button class="sub-btn ${currentSubgroup === sub.name ? 'active' : ''}" onclick="filterSubgroup('${sub.name}')">${sub.name}</button>`;
            });
            bar.innerHTML = html;
            bar.style.display = 'flex';
        }

        window.filterSubgroup = function(sub) {
            currentSubgroup = sub;
            document.querySelectorAll('.sub-btn').forEach(btn => {
                if(btn.textContent === sub || (sub === 'Todos' && btn.textContent === 'Todos')) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            filterProducts();
        }

        function singularize(word) {
            if (!word) return '';
            let trimmed = word.trim();
            if (trimmed.toLowerCase().endsWith('s') && trimmed.length > 3) {
                return trimmed.slice(0, -1);
            }
            return trimmed;
        }

        window.filterProducts = function() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const grid = document.getElementById('productsGrid');

            const filtered = allProducts.filter(p => {
                const matchCategory = (currentCategory === 'Todas') || (p.category === currentCategory);
                const matchSubgroup = (currentSubgroup === 'Todos') || (p.subgroup === currentSubgroup);
                
                const titleMatch = (p.title || '').toLowerCase().includes(searchQuery);
                const codeMatch = (p.code || '').toLowerCase().includes(searchQuery);
                const descMatch = (p.description || '').toLowerCase().includes(searchQuery);

                const matchSearch = !searchQuery || titleMatch || codeMatch || descMatch;

                return matchCategory && matchSubgroup && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="loading" style="grid-column: span 2;">Nenhuma peça encontrada.</div>';
                return;
            }

            let html = '';
            filtered.forEach(p => {
                const singularSub = singularize(p.subgroup);
                const displayName = singularSub ? `${singularSub} ${p.title}` : p.title;
                let msgText = `Olá! Gostaria de encomendar a peça: *${displayName}* (${p.price}) [Cód: ${p.code || 'N/A'}]`;
                if (p.description) msgText += `\nDetalhes: ${p.description}`;
                const message = encodeURIComponent(msgText);

                const snippetHtml = p.description ? `<div class="product-snippet">${p.description}</div>` : '';
                const codeHtml = p.code ? `<div class="product-code">${p.code}</div>` : '';

                html += `
                    <div class="product-card" onclick="openDetails('${p.id}')">
                        <div class="product-img-wrapper">
                            <img src="${p.image || 'https://via.placeholder.com/300'}" alt="${p.title}" class="product-img">
                        </div>
                        <div class="product-info">
                            <div>
                                ${codeHtml}
                                <h3 class="product-title">${p.title}</h3>
                                <div class="product-price">${p.price}</div>
                                ${snippetHtml}
                            </div>
                            <a href="https://wa.me/5521994778733?text=${message}" target="_blank" class="whatsapp-btn" onclick="event.stopPropagation()">
                                <i class="fa-brands fa-whatsapp"></i> Encomendar
                            </a>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        window.openDetails = function(id) {
            const p = allProducts.find(item => item.id === id);
            if (!p) return;

            let photos = [];
            if (p.image) photos.push(p.image);
            if (p.extraImages && Array.isArray(p.extraImages)) {
                photos = photos.concat(p.extraImages);
            }

            let galleryHtml = '';
            if (photos.length > 1) {
                galleryHtml = '<div class="gallery-scroll">';
                photos.forEach((img, idx) => {
                    galleryHtml += `
                        <div class="thumb-box ${idx === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)">
                            <img src="${img}" class="thumb-img">
                        </div>
                    `;
                });
                galleryHtml += '</div>';
            }

            let infoHtml = '';
            if (p.description) {
                infoHtml = `
                    <div class="card-info">
                        <h3>Detalhes e Medidas</h3>
                        <p>${p.description}</p>
                    </div>
                `;
            }

            const singularSub = singularize(p.subgroup);
            const displayName = singularSub ? `${singularSub} ${p.title}` : p.title;
            let msgText = `Olá! Gostaria de encomendar a peça: *${displayName}* (${p.price}) [Cód: ${p.code || 'N/A'}]`;
            if (p.description) msgText += `\nDetalhes: ${p.description}`;
            const message = encodeURIComponent(msgText);

            const html = `
                <div class="main-img-box">
                    <img id="mainImageDisplay" src="${photos[0] || 'https://via.placeholder.com/400'}" class="main-img" alt="${p.title}">
                </div>
                ${galleryHtml}
                <div class="piece-code-tag">${p.code || ''} ${p.subgroup ? '• ' + p.subgroup : ''}</div>
                <h1 class="piece-title">${p.title}</h1>
                <div class="piece-price">${p.price}</div>
                ${infoHtml}
                <a href="https://wa.me/5521994778733?text=${message}" target="_blank" class="whatsapp-btn-large">
                    <i class="fa-brands fa-whatsapp fa-lg"></i> Encomendar via WhatsApp
                </a>
            `;

            document.getElementById('detailContent').innerHTML = html;
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.changeMainImage = function(src, element) {
            document.getElementById('mainImageDisplay').src = src;
            document.querySelectorAll('.thumb-box').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        window.goHome = function() {
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
