<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOR.IM CERÂMICAS - Catálogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-yellow: #FEFEF0;
            --primary-purple: #4A3A63;
            --accent-purple: #6B548E;
            --text-dark: #2D2438;
            --white: #FFFFFF;
            --shadow: 0 8px 24px rgba(74, 58, 99, 0.08);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-yellow);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-image: 
                linear-gradient(45deg, rgba(240, 235, 210, 0.3) 25%, transparent 25%), 
                linear-gradient(-45deg, rgba(240, 235, 210, 0.3) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, rgba(240, 235, 210, 0.3) 75%), 
                linear-gradient(-45deg, transparent 75%, rgba(240, 235, 210, 0.3) 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
        }

        .store-wrapper {
            width: 100%;
            max-width: 600px;
            background: var(--white);
            min-height: 100vh;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(74, 58, 99, 0.08);
            border-right: 1px solid rgba(74, 58, 99, 0.08);
        }

        /* Topo / Header Alinhado à Esquerda */
        .store-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid rgba(74, 58, 99, 0.1);
            background: var(--bg-yellow);
        }
        .header-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: transparent;
            flex-shrink: 0;
        }
        .header-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }
        .store-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--primary-purple);
            font-weight: 700;
            white-space: nowrap;
        }
        .store-subtitle {
            font-size: 0.82rem;
            color: var(--accent-purple);
            font-style: italic;
            margin-top: 2px;
        }

        /* Container de Conteúdo */
        .store-body { padding: 20px; flex-grow: 1; }

        /* Catálogo e Peças (Seu layout existente do index continuará funcionando abaixo deste cabeçalho) */
        .loading { text-align: center; padding: 40px; color: var(--accent-purple); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="store-wrapper">
        <!-- CABEÇALHO ATUALIZADO COM LOGO À ESQUERDA -->
        <header class="store-header">
            <img id="storeLogoImg" src="" class="header-logo" alt="Logo" style="display: none;">
            <div class="header-text">
                <h1 class="store-title">AMOR.IM CERÂMICAS</h1>
                <p class="store-subtitle">Arte em cerâmica afetiva</p>
            </div>
        </header>

        <div class="store-body" id="storeContent">
            <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> A carregar catálogo...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-9EgZW2PsJ3A1lwghkx8x5tjC6kd1dJg",
            authDomain: "amorimceramicas.firebaseapp.com",
            databaseURL: "https://amorimceramicas-default-rtdb.firebaseio.com",
            projectId: "amorimceramicas",
            storageBucket: "amorimceramicas.firebasestorage.app",
            messagingSenderId: "805924176382",
            appId: "1:805924176382:web:f9766ef6c7c43561f940af",
            measurementId: "G-8XQB9YEBRM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Carrega logo instantânea do cache se disponível
        const cachedLogo = localStorage.getItem('amorim_logo_cache');
        if (cachedLogo) {
            const logoEl = document.getElementById('storeLogoImg');
            logoEl.src = cachedLogo;
            logoEl.style.display = 'block';
        }

        const dataRef = ref(db, 'amorim');
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.logo) {
                const logoEl = document.getElementById('storeLogoImg');
                logoEl.src = data.logo;
                logoEl.style.display = 'block';
                localStorage.setItem('amorim_logo_cache', data.logo);
            }
        });
    </script>
</body>
</html>
